openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Daymark memory app API
servers:
  - url: /api
    description: Base API path
tags:
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: health
    description: Health operations
  - name: memories
    description: Memory (gift) operations
  - name: people
    description: People operations
  - name: calendar
    description: Calendar and upcoming dates
  - name: future-gifts
    description: Future gift operations
  - name: home
    description: Home screen data
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to the OIDC logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
        '500':
          description: Failed to generate upload URL.
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve a private object entity
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /home/summary:
    get:
      operationId: getHomeSummary
      tags: [home]
      summary: Get home screen summary — upcoming events, gift from the past, recent people
      responses:
        "200":
          description: Home summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeSummary"

  /memories:
    get:
      operationId: listMemories
      tags: [memories]
      summary: List all memories
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: view
          in: query
          schema:
            type: string
            enum: [grid, timeline, calendar, map]
      responses:
        "200":
          description: List of memories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Memory"
    post:
      operationId: createMemory
      tags: [memories]
      summary: Create a new memory (wrap a memory)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryInput"
      responses:
        "201":
          description: Created memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"

  /memories/{id}:
    get:
      operationId: getMemory
      tags: [memories]
      summary: Get a single memory by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Memory detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
        "404":
          description: Not found
    patch:
      operationId: updateMemory
      tags: [memories]
      summary: Update a memory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryUpdate"
      responses:
        "200":
          description: Updated memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
    delete:
      operationId: deleteMemory
      tags: [memories]
      summary: Delete a memory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /memories/{id}/keep-close:
    post:
      operationId: keepMemoryClose
      tags: [memories]
      summary: Mark a memory as kept close (favorited)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"

  /people:
    get:
      operationId: listPeople
      tags: [people]
      summary: List all people
      responses:
        "200":
          description: List of people
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
    post:
      operationId: createPerson
      tags: [people]
      summary: Add a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonInput"
      responses:
        "201":
          description: Created person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"

  /people/{id}:
    get:
      operationId: getPerson
      tags: [people]
      summary: Get a person and their shared memories
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Person detail with memories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonDetail"
        "404":
          description: Not found

  /calendar/events:
    get:
      operationId: listCalendarEvents
      tags: [calendar]
      summary: List upcoming and past events/dates
      parameters:
        - name: month
          in: query
          schema:
            type: number
        - name: year
          in: query
          schema:
            type: number
      responses:
        "200":
          description: List of calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"

  /calendar/on-this-day:
    get:
      operationId: getOnThisDay
      tags: [calendar]
      summary: Get memories from this day in past years
      responses:
        "200":
          description: On this day memories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Memory"

  /future-gifts:
    get:
      operationId: listFutureGifts
      tags: [future-gifts]
      summary: List all future gifts
      responses:
        "200":
          description: List of future gifts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FutureGift"
    post:
      operationId: createFutureGift
      tags: [future-gifts]
      summary: Create a future gift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FutureGiftInput"
      responses:
        "201":
          description: Created future gift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FutureGift"

  /future-gifts/{id}:
    get:
      operationId: getFutureGift
      tags: [future-gifts]
      summary: Get a future gift (only returns content if unlock date has passed)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Future gift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FutureGift"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for the authenticated user
      responses:
        "200":
          description: Notification list with unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean

  /auth/profile:
    patch:
      operationId: patchUserProfile
      tags: [auth]
      summary: Update authenticated user profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"

  /auth/onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [auth]
      summary: Mark onboarding as completed for the authenticated user
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Memory:
      type: object
      required: [id, title, date, category, giftColor, ribbon, isKeptClose, createdAt]
      properties:
        id:
          type: number
        title:
          type: string
        story:
          type: ["string", "null"]
        date:
          type: string
          format: date
        location:
          type: ["string", "null"]
        category:
          type: string
          enum: [travel, friends, family, achievements, everyday]
        mood:
          type: ["string", "null"]
        giftColor:
          type: string
        ribbon:
          type: string
        sticker:
          type: ["string", "null"]
        photoUrls:
          type: array
          items:
            type: string
        people:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        isKeptClose:
          type: boolean
        createdAt:
          type: string
          format: date-time

    MemoryInput:
      type: object
      required: [title, date, category]
      properties:
        title:
          type: string
          minLength: 1
        story:
          type: string
        date:
          type: string
          format: date
        location:
          type: string
        category:
          type: string
          enum: [travel, friends, family, achievements, everyday]
        mood:
          type: string
        giftColor:
          type: string
        ribbon:
          type: string
        sticker:
          type: string
        photoUrls:
          type: array
          items:
            type: string
        personIds:
          type: array
          items:
            type: number

    MemoryUpdate:
      type: object
      properties:
        title:
          type: string
        story:
          type: string
        date:
          type: string
          format: date
        location:
          type: string
        category:
          type: string
          enum: [travel, friends, family, achievements, everyday]
        mood:
          type: string
        giftColor:
          type: string
        ribbon:
          type: string
        sticker:
          type: string
        photoUrls:
          type: array
          items:
            type: string
        personIds:
          type: array
          items:
            type: number

    Person:
      type: object
      required: [id, name]
      properties:
        id:
          type: number
        name:
          type: string
        relationship:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        birthday:
          type: ["string", "null"]
          format: date
        memoriesCount:
          type: number

    PersonDetail:
      type: object
      required: [id, name, memories]
      properties:
        id:
          type: number
        name:
          type: string
        relationship:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        birthday:
          type: ["string", "null"]
          format: date
        memoriesCount:
          type: number
        nextImportantDate:
          type: ["string", "null"]
        memories:
          type: array
          items:
            $ref: "#/components/schemas/Memory"

    PersonInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        relationship:
          type: string
        avatarUrl:
          type: string
        birthday:
          type: string
          format: date

    CalendarEvent:
      type: object
      required: [id, title, date, type]
      properties:
        id:
          type: number
        title:
          type: string
        date:
          type: string
          format: date
        type:
          type: string
          enum: [birthday, memory, travel, anniversary, achievement]
        memoryId:
          type: ["number", "null"]
        personId:
          type: ["number", "null"]
        daysUntil:
          type: ["number", "null"]

    FutureGift:
      type: object
      required: [id, title, recipientName, unlockDate, isLocked, createdAt]
      properties:
        id:
          type: number
        title:
          type: string
        recipientName:
          type: string
        unlockDate:
          type: string
          format: date
        isLocked:
          type: boolean
        message:
          type: ["string", "null"]
        photoUrls:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    FutureGiftInput:
      type: object
      required: [title, recipientName, unlockDate]
      properties:
        title:
          type: string
          minLength: 1
        recipientName:
          type: string
          minLength: 1
        unlockDate:
          type: string
          format: date
        message:
          type: string
        photoUrls:
          type: array
          items:
            type: string

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: number
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string

    HomeSummary:
      type: object
      required: [upcomingEvents, giftFromPast, recentPeople, totalMemories]
      properties:
        upcomingEvents:
          type: array
          items:
            $ref: "#/components/schemas/CalendarEvent"
        giftFromPast:
          oneOf:
            - $ref: "#/components/schemas/Memory"
            - type: "null"
        recentPeople:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        totalMemories:
          type: number

    Notification:
      type: object
      required: [id, userId, type, title, createdAt]
      properties:
        id:
          type: number
        userId:
          type: string
        type:
          type: string
        title:
          type: string
        message:
          type: [string, 'null']
        relatedMemoryId:
          type: [number, 'null']
        relatedFutureGiftId:
          type: [number, 'null']
        readAt:
          type: [string, 'null']
        createdAt:
          type: string

    NotificationList:
      type: object
      required: [notifications, unreadCount]
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        unreadCount:
          type: number

    UserProfileUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        profileImageUrl:
          type: string

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl, onboardingCompleted]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
        onboardingCompleted:
          type: boolean
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          # no format: uri — Orval/Zod v3 doesn't support z.url()
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
